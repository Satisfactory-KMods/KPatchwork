name: KPatchwork CI

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-package:
    name: Lint packs and package project
    runs-on: arc-runner
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
    steps:
      - name: Checkout trusted CI code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pull request contents
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Select source tree
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "SOURCE=pr-repo" >> "$GITHUB_ENV"
          else
            echo "SOURCE=ci-repo" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r ci-repo/ci/requirements.txt
        shell: bash

      - name: Lint all KDataForge packs
        run: python ci-repo/ci/lint_packs.py --root "$SOURCE/KDataForge"
        shell: bash

      - name: Check contributor ownership
        id: policy
        if: github.event_name == 'pull_request_target'
        run: |
          python ci-repo/ci/changed_pack_policy.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --root "$SOURCE"
        shell: bash

      - name: Create KPatchwork ZIP
        run: python ci-repo/ci/package_project.py --root "$SOURCE" --output "$GITHUB_WORKSPACE/KPatchwork.zip"
        shell: bash

      - name: Generate changelog from commits
        run: |
          python ci-repo/ci/generate_changelog.py \
            --root "$SOURCE" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}" \
            --output "$GITHUB_WORKSPACE/CHANGELOG.md"
        shell: bash

      - name: Upload KPatchwork ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KPatchwork
          path: |
            KPatchwork.zip
            CHANGELOG.md
          if-no-files-found: error

  auto-merge-owned-packs:
    name: Auto-merge author-owned packs
    needs: validate-package
    if: github.event_name == 'pull_request_target' && needs.validate-package.outputs.eligible == 'true'
    runs-on: arc-runner
    steps:
      - name: Approve author-owned pack changes
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
              body: 'CI verified that all changed packs belong to the pull-request author.'
            });

      - name: Enable squash auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.graphql(`
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(
                  input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }
                ) { clientMutationId }
              }
            `, { pullRequestId: context.payload.pull_request.node_id });

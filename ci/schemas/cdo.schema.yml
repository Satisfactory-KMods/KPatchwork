$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/cdo.schema.yml
x-kdf-type: cdo
title: KDataForge CDO patches
allOf:
  - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [patches]
    properties:
      type: { const: cdo }
      priority:
        type: integer
        minimum: -2147483648
        maximum: 2147483647
      patches:
        type: array
        minItems: 1
        items:
          type: object
          unevaluatedProperties: false
          required: [properties]
          allOf:
            - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/scopeFilters
            - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/scopeNeedsOfClass
            - if:
                anyOf:
                  - required: [classType]
                  - required: [excludeClasses]
              then:
                anyOf:
                  - required: [ofClass]
                  - required: [producedIn]
                  - required: [ingredient]
                  - required: [product]
          properties:
            classType:
              type: string
              enum: [any, blueprint, native]
            excludeClasses:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/stringOrList
            target:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/stringOrList
            allAssetsOfClass:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
            matchTag:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/stringOrList
            ofClass:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
            tagProperty:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
            matchAssets: { type: boolean, default: true }
            applyToSubclasses: { type: boolean, default: false }
            applyToSpawnedActors: { type: boolean, default: false }
            deferOneGameTick: { type: boolean, default: false }
            properties:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/properties
          anyOf:
            - required: [target]
            - required: [allAssetsOfClass]
            - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/hasScopeFilter
            - required: [classType]
            - required: [excludeClasses]
unevaluatedProperties: false
